name: Bug report
description: Report a reproducible problem with Markdown Table GUI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Markdown Table GUI. Do not include credentials, private documents, or vulnerability details. Security issues must be reported through the repository's Security tab.
  - type: input
    id: versions
    attributes:
      label: Environment
      description: Include the extension, VS Code, and OS versions, plus Desktop or Web.
      placeholder: Markdown Table GUI x.y.z; VS Code 1.125.0; Windows 11; Desktop
    validations:
      required: true
  - type: input
    id: appearance
    attributes:
      label: Appearance
      description: Include the theme, editor width, and VS Code or grid zoom when relevant.
      placeholder: Dark Modern; 800 px editor; VS Code 100%; grid 125%
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest table and exact actions that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Explain what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add sanitized Markdown, logs, screenshots, or a short recording if useful.
